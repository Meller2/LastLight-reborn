name: Build Standalone APK (On-Device .nsp Packer)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository with peanuts-native submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply local peanuts-native patches & Metro profile
        run: |
          git -C peanuts-native apply ../patches/peanuts-native.patch
          mkdir -p peanuts-native/dm/games/0100F0400E850000
          cp -r patches/0100F0400E850000/* peanuts-native/dm/games/0100F0400E850000/

      - name: Install build dependencies (zsh, ninja, perl/shasum)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh ninja-build perl curl unzip

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup .NET 10 SDK (NativeAOT for libdmsh_xlate.so)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Android SDK & NDK 29.0.14206865
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Build on-device packer stage (CPython 3.14 + Capstone + LZ4 + dmsh_xlate + SPIRV-Tools)
        run: |
          zsh peanuts-native/android/ondevice/build.sh /tmp/ll-stage all

      - name: Assemble Standalone Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PllPackStage=/tmp/ll-stage/stage --no-daemon
          cp app/build/outputs/apk/release/app-release.apk LastLightReborn-standalone-arm64.apk
          ls -lh LastLightReborn-standalone-arm64.apk

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastLightReborn-standalone-arm64
          path: LastLightReborn-standalone-arm64.apk
          retention-days: 30
